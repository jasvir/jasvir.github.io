name: Check island

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check content, layout, and export fixture
        run: node --test tests/*.test.mjs examples/island-profile-spike/verify.test.mjs
