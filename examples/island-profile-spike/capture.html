<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island profile — capture and preview</title>
<style>
body{margin:32px auto;max-width:980px;padding:0 24px;font:15px/1.5 system-ui;color:#21383a;background:#fffdf8}
h1{font:34px Georgia,serif;margin-bottom:8px}a{color:#a3088a}button{font:inherit;cursor:pointer;border:1px solid #d8ded5;border-radius:8px;padding:9px 12px;background:white;color:inherit}
.toolbar{display:flex;gap:16px;align-items:center;margin:20px 0}.island{display:grid;grid-template-columns:175px minmax(0,600px);gap:20px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left}nav button[aria-pressed=true]{background:#f7e9f5;border-color:#d00dad;color:#96087c}
canvas{display:block;width:100%;height:auto;border-radius:12px}#read-more{min-height:60px}#status{min-height:24px;font-size:13px;color:#586b66}
@media(max-width:700px){.island{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap}.toolbar{flex-wrap:wrap}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"}}
</script>
<h1>Around the islands</h1>
<p>Choose a place to zoom in, then see its story. The labels and cards are included in the exported artwork.</p>
<div class="toolbar"><button id="capture" disabled>Capture all views</button><a href="/examples/island-profile-spike/preview.html">Open CSS-only README preview</a></div>
<p id="status" role="status">Run <code>npm run capture</code> and open the printed HTTP address to use this page.</p>
<div class="island"><nav id="places" aria-label="Island places"></nav><section><canvas id="island-canvas" width="600" height="360" aria-label="Labelled project island"></canvas><div id="read-more"></div></section></div>
<script type="module">
const status = document.querySelector("#status");
const capture = document.querySelector("#capture");
try {
  if (location.protocol === "file:") throw new Error("Open this page through the local server: run npm run capture, then visit http://127.0.0.1:8422/");
  const response = await fetch("/capture/config");
  if (!response.ok) throw new Error("This page needs the capture server. Run npm run capture.");
  const config = await response.json();
  const { renderExportFrame } = await import("/examples/island-profile-spike/capture-adapter.js");
  const places = document.querySelector("#places");
  const more = document.querySelector("#read-more");
  let animation, selected = config.views[0];
  function showLinks(view) {
    const text = document.createElement("p"); text.textContent = view.description;
    const links = document.createElement("p");
    const items = view.links?.length ? view.links : [{label:view.id==="overview"?"Explore the full island":"About Me on the full island",url:view.href}];
    items.forEach((item,index) => {
      if(index) links.append(" · ");
      const link = document.createElement("a"); link.href=item.url; link.textContent=item.label; link.target="_blank"; link.rel="noreferrer"; links.append(link);
    });
    more.replaceChildren(text,links);
  }
  function select(view) {
    cancelAnimationFrame(animation); selected=view; more.replaceChildren();
    places.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed",String(button.dataset.view===view.id)));
    const start=performance.now();
    function tick(now) {
      // A queued animation frame can carry a timestamp just before selection.
      const elapsed=Math.max(0,now-start);
      const phase=view.id==="overview"?(elapsed/20000)%1:Math.min(1,elapsed/1600);
      renderExportFrame(view.id,phase);
      if(view.id==="overview"||phase<1) animation=requestAnimationFrame(tick);
      else showLinks(view);
    }
    if(view.id==="overview") showLinks(view);
    animation=requestAnimationFrame(tick);
  }
  for(const view of config.views) {
    const button=document.createElement("button");button.textContent=view.title;button.dataset.view=view.id;
    button.onclick=()=>select(view);places.append(button);
  }
  capture.disabled=false;
  status.textContent=`Ready. Shared source ${config.sourceHash.slice(0,12)}. Labels included in every frame.`;
  select(selected);
  capture.onclick=async()=>{
    cancelAnimationFrame(animation);
    const buttons=[capture,...places.querySelectorAll("button")];
    buttons.forEach(button=>button.disabled=true);
    try {
      for(const view of config.views) {
        const atlas=document.createElement("canvas");
        atlas.width=config.width*config.columns;atlas.height=config.height*Math.ceil(view.frames/config.columns);
        const context=atlas.getContext("2d");
        for(let index=0;index<view.frames;index++) {
          const phase=index/(view.id==="overview"?view.frames:view.frames-1);
          const frame=renderExportFrame(view.id,phase);
          context.drawImage(frame,(index%config.columns)*config.width,Math.floor(index/config.columns)*config.height);
          status.textContent=`Capturing ${view.title}: ${index+1}/${view.frames}`;
          await new Promise(requestAnimationFrame);
        }
        const blob=await new Promise(resolve=>atlas.toBlob(resolve,"image/webp",config.quality));
        if(!blob||blob.type!=="image/webp") throw new Error("WebP encoding unavailable");
        const saved=await fetch(`/capture/atlas/${view.id}`,{method:"POST",headers:{"Content-Type":"image/webp"},body:blob});
        if(!saved.ok) throw new Error(await saved.text());
        atlas.width=atlas.height=1;
      }
      const built=await fetch("/capture/build",{method:"POST"});
      if(!built.ok) throw new Error(await built.text());
      const result=await built.json();
      status.textContent=`Export complete: ${result.views.length} labelled views, ${(result.svgBytes/1048576).toFixed(2)} MiB total. Open the CSS-only preview.`;
    } catch(error) {status.textContent=`Export failed: ${error.message}`;}
    finally {buttons.forEach(button=>button.disabled=false);select(selected);}
  };
} catch(error) {status.textContent=`Scene failed to load: ${error.message}`;}
</script></html>
